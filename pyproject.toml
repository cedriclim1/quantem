[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = ["tests", "widget/tests"]

[tool.ruff.lint]
select = ["E4","E7","E9","F","I"]
exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]

[tool.ruff]
line-length = 99

[tool.uv]
config-settings-package = { quantem = { editable_mode = "compat" } }

[tool.uv.extra-build-dependencies]
fasttomo = [
    { requirement = "nvidia-cuda-nvcc; sys_platform == 'linux' or sys_platform == 'win32'", match-runtime = true },
    { requirement = "nvidia-cuda-cccl; sys_platform == 'linux' or sys_platform == 'win32'", match-runtime = true },
    { requirement = "nvidia-cuda-runtime; sys_platform == 'linux' or sys_platform == 'win32'", match-runtime = true },
    { requirement = "nvidia-cuda-crt; sys_platform == 'linux' or sys_platform == 'win32'", match-runtime = true },
    { requirement = "nvidia-nvvm; sys_platform == 'linux' or sys_platform == 'win32'", match-runtime = true },
]

[tool.uv.workspace]
members = ["widget"]

[tool.uv.sources]
"quantem.widget" = { workspace = true }
fasttomo = { git = "https://github.com/cedriclim1/FastTomo.git" }

[project]
name = "quantem"
version = "0.1.8"
description = "quantitative electron microscopy analysis toolkit."
keywords = ["EM","TEM","STEM","4DSTEM"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "colorspacious",
  "dill",
  "numpy>2",
  "matplotlib",
  "scipy",
  "tqdm",
  "zarr>3",
  "cmasher>=1.9.2",
  "rosettasciio>=0.8.0",
  "h5py>=3.13.0",
  "torch>=2.7.0",
  "scikit-image>=0.25.2",
  "torchvision>=0.22.1",
  "tensorboard>=2.19.0",
  "torchmetrics>=1.7.3",
  "optuna>=4.5.0",
  "hdf5plugin>=6.0.0",
  "torchinfo>=1.8.0",
]

[project.optional-dependencies]
widgets = [
    "quantem.widget",
]
tomography = [
    # The tomography extra is gated to Python >= 3.14 pending validation
    # on older interpreters. On Python 3.12/3.13 the extra resolves to
    # an empty set; users should run `uv sync --python 3.14 --extra
    # tomography` (or set .python-version to 3.14) to opt in.
    "fasttomo; python_version >= '3.14'",
    # CUDA toolkit wheels — additionally gated to platforms where they
    # actually publish (linux x86_64/aarch64, win_amd64). On macOS/
    # other arches they're omitted and FastTomo's CMake falls back to
    # a CPU-only build.
    #
    # Pin every component to 13.0.x. The wheels do not pin their own
    # transitive deps tightly, so a loose `nvidia-cuda-nvcc` alone
    # lets nvidia-nvvm/cuda-crt resolve to a newer minor whose cicc
    # emits PTX the older ptxas cannot assemble. Must also match
    # torch's cu130 build and the driver's max (CUDA 13.1).
    "nvidia-cuda-nvcc==13.0.*; python_version >= '3.14' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "nvidia-cuda-cccl==13.0.*; python_version >= '3.14' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "nvidia-cuda-runtime==13.0.*; python_version >= '3.14' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "nvidia-cuda-crt==13.0.*; python_version >= '3.14' and (sys_platform == 'linux' or sys_platform == 'win32')",
    "nvidia-nvvm==13.0.*; python_version >= '3.14' and (sys_platform == 'linux' or sys_platform == 'win32')",
]

[tool.hatch.build.targets.sdist]
# hatchling always includes:
# pyproject.toml, .gitignore, any README, any LICENSE, AUTHORS
only-include = [
    "/src",
    "/tests",
    "/CITATION.cff"
]

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=7.0.0",
]
dev = [
    { include-group = "test" },
    "jupyterlab>=4.4.0",
    "packaging>=24.2",
    "pre-commit>=4.2.0",
    "ruff>=0.11.5",
    "tomli>=2.2.1",
]